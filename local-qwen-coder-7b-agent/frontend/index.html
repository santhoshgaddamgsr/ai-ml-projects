<!DOCTYPE html>
<html>
<head>
    <title>Local Qwen Coding Agent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
        }
        select, button {
            padding: 10px;
            margin-top: 10px;
        }
        pre {
            background: #222;
            color: #0f0;
            padding: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h2>🚀 Local Qwen Coding Agent</h2>

<label>Mode:</label>
<select id="mode">
    <option value="generate">Generate</option>
    <option value="fix">Fix</option>
    <option value="review">Review</option>
</select>

<br><br>

<label>Prompt:</label>
<textarea id="prompt"></textarea>

<br>

<button onclick="callAgent()">Run Agent</button>

<h3>Response:</h3>
<pre id="result"></pre>

<script>
async function callAgent() {

    const prompt = document.getElementById("prompt").value;
    const mode = document.getElementById("mode").value;

    const response = await fetch("http://127.0.0.1:8002/agent", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            prompt: prompt,
            mode: mode
        })
    });

    const data = await response.json();

    document.getElementById("result").textContent = data.result;
}
</script>

</body>
</html>
